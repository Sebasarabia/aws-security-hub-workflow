[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-security-hub-workflow"
version = "0.1.0"
description = "Educational Security Hub finding workflow"
requires-python = ">=3.13,<3.14"
license = "MIT-0"
dependencies = [
  "aws-lambda-powertools==3.34.0",
  "boto3==1.43.83",
  "pydantic==2.13.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 110
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["finding_processor"]
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=src/finding_processor --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ['if TYPE_CHECKING:', 'if __name__ == .__main__.:', '\.\.\.']
