name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: make setup
      - run: make lint typecheck test
      - run: make package
      - run: .venv/bin/python -m pip_audit -r requirements.txt

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
      - run: AWS_EC2_METADATA_DISABLED=true terraform -chdir=terraform test
      - run: tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
        working-directory: terraform
      - run: tflint --recursive --config="$GITHUB_WORKSPACE/.tflint.hcl"
        working-directory: terraform
      # Standalone binary avoids action/setup tags affected by the March 2026 Trivy incident.
      - name: Install checksum-pinned Trivy
        run: |
          curl -fsSLo /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
      - run: /tmp/trivy config --exit-code 1 --severity HIGH,CRITICAL terraform

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npx --yes markdownlint-cli2@0.18.1 '**/*.md' '!**/.venv/**' '!**/.terraform/**'
