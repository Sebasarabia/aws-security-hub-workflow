name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
      - run: make setup
      - run: make lint typecheck test
      - run: make package
      - run: .venv/bin/python -m pip_audit -r requirements.txt

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
      - uses: terraform-linters/setup-tflint@ae78205cfffec9e8d93fd2b3115c7e9d3166d4b6 # v4.1.1
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
      - run: AWS_EC2_METADATA_DISABLED=true terraform -chdir=terraform test
      - run: tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
        working-directory: terraform
      - run: tflint --recursive --config="$GITHUB_WORKSPACE/.tflint.hcl"
        working-directory: terraform
      # Standalone binary avoids action/setup tags affected by the March 2026 Trivy incident.
      - name: Install checksum-pinned Trivy
        run: |
          curl -fsSLo /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
      - run: /tmp/trivy config --exit-code 1 --severity HIGH,CRITICAL terraform

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: npx --yes markdownlint-cli2@0.18.1 '**/*.md' '!**/.venv/**' '!**/.terraform/**'
